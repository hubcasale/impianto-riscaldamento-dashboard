# Proxy Bluetooth per la stufa: ESP32-C3 SuperMini accanto alla stufa.
# Serve al modo "Bluetooth locale" di Micronova Agua IOT (hubcasale): Home Assistant parla con il modulo della stufa
# (si annuncia come T009_BFDA9C) attraverso questa scheda, senza passare dal cloud.
# Prima installazione: via USB con ESPHome Web (Chrome); poi gli aggiornamenti via Wi-Fi.
# Alimentazione: caricatore USB da telefono in una presa vicina (non dalla USB della stufa, salvo prova con il tester).

substitutions:
  device_name: ble-proxy-stufa

esphome:
  name: ${device_name}
  friendly_name: Proxy Bluetooth stufa

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

# porta USB nativa della C3: il log passa da qui (senza questa riga non si vede nulla via USB)
logger:
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret api_encryption_key
  # senza Home Assistant per 5 minuti la scheda si riavvia (predefinito 15): il 20/11/2026 e' rimasta 15 minuti non raggiungibile
  reboot_timeout: 5min

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # senza Wi-Fi per 5 minuti si riavvia (predefinito 15)
  reboot_timeout: 5min
  # Wi-Fi e Bluetooth condividono la radio: niente risparmio energetico
  power_save_mode: none
  # molte SuperMini hanno l'antenna poco curata: con la potenza al massimo il Wi-Fi diventa instabile
  output_power: 8.5dB
  ap:
    ssid: proxy-stufa-hotspot
    password: !secret hotspot_password

# se il Wi-Fi di casa cambia, la scheda crea la rete proxy-stufa-hotspot per reimpostarlo
captive_portal:

# ---------- Bluetooth: proxy attivo (serve per le connessioni, non solo per la scansione) ----------
esp32_ble_tracker:
  scan_parameters:
    interval: 320ms
    window: 40ms
    active: true
  # segnala quando vede il modulo della stufa: ultimo avviso sempre registrato, testo e RSSI pubblicati al massimo ogni 30 s
  on_ble_advertise:
    then:
      - lambda: |-
          const std::string &n = x.get_name();
          if (n.rfind("T009_", 0) == 0 || n.rfind("NAVEL_", 0) == 0 || n.rfind("Navel_", 0) == 0) {
            uint32_t ora = millis();
            bool primo = id(ble_ultimo_avviso) == 0;
            id(ble_ultimo_avviso) = ora;
            if (!primo && ora - id(ble_ultima_pubblicazione) < 30000) return;
            id(ble_ultima_pubblicazione) = ora;
            char buf[80];
            snprintf(buf, sizeof(buf), "%s %s %d dBm", n.c_str(), x.address_str().c_str(), x.get_rssi());
            id(ble_modulo_stufa).publish_state(buf);
            id(ble_rssi_stufa).publish_state(x.get_rssi());
          }

bluetooth_proxy:
  active: true
  # i 3 slot di connessione (valore predefinito) con un id, per poterli leggere e contare i dispositivi collegati
  connections:
    - id: ble_conn_1
    - id: ble_conn_2
    - id: ble_conn_3

# ---------- Guardiano del Bluetooth ----------
# Se la scheda e' collegata ma non sente piu' il modulo della stufa, il Bluetooth e' bloccato: si riavvia.
# Il modulo si annuncia di continuo (da giorni "Modulo stufa visibile" e' quasi sempre acceso), quindi 10 minuti di silenzio
# sono un blocco. Si parte dopo 15 minuti dall'avvio. Dopo 3 riavvii di fila senza mai risentirlo il guardiano smette
# (stufa spenta o fuori portata): il contatore si azzera appena il modulo torna a farsi sentire.
interval:
  - interval: 60s
    then:
      - lambda: |-
          const uint32_t ora = millis();
          if (ora < 15 * 60 * 1000UL) return;
          const bool sentito = id(ble_ultimo_avviso) != 0 && (ora - id(ble_ultimo_avviso)) < 10 * 60 * 1000UL;
          if (sentito) {
            if (id(ble_riavvii_guardiano) != 0) id(ble_riavvii_guardiano) = 0;
            return;
          }
          if (id(ble_riavvii_guardiano) >= 3) return;
          id(ble_riavvii_guardiano) += 1;
          ESP_LOGW("guardiano", "modulo stufa non sentito da 10 minuti: riavvio (%d)", id(ble_riavvii_guardiano));
          App.safe_reboot();

# istanti (millis) dell'ultimo avviso del modulo della stufa e dell'ultima pubblicazione dei dati
globals:
  # riavvii di fila del guardiano (resta salvato nella memoria della scheda)
  - id: ble_riavvii_guardiano
    type: int
    restore_value: yes
    initial_value: "0"
  - id: ble_ultimo_avviso
    type: uint32_t
    initial_value: "0"
  - id: ble_ultima_pubblicazione
    type: uint32_t
    initial_value: "0"

# motivo dell'ultimo riavvio (alimentazione, watchdog, software...) e riavvii del guardiano
debug:

text_sensor:
  - platform: debug
    reset_reason:
      name: "Motivo ultimo riavvio"
      entity_category: diagnostic
  - platform: template
    name: "BLE modulo stufa"
    id: ble_modulo_stufa
    entity_category: diagnostic
    icon: mdi:bluetooth
  # indirizzi dei dispositivi Bluetooth collegati in questo momento attraverso il proxy
  - platform: template
    name: "Dispositivi collegati (indirizzi)"
    entity_category: diagnostic
    icon: mdi:bluetooth-connect
    update_interval: 10s
    lambda: |-
      std::string r;
      if (id(ble_conn_1)->connected()) r += std::string(id(ble_conn_1)->address_str()) + " ";
      if (id(ble_conn_2)->connected()) r += std::string(id(ble_conn_2)->address_str()) + " ";
      if (id(ble_conn_3)->connected()) r += std::string(id(ble_conn_3)->address_str()) + " ";
      if (r.empty()) return std::string("nessuno");
      r.pop_back();
      return r;

sensor:
  - platform: wifi_signal
    name: "Segnale Wi-Fi"
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: "Tempo di attivita"
    update_interval: 60s
    entity_category: diagnostic
  # riavvii di fila fatti dal guardiano del Bluetooth (0 = tutto bene)
  - platform: template
    name: "Riavvii del guardiano"
    accuracy_decimals: 0
    state_class: measurement
    entity_category: diagnostic
    icon: mdi:restart-alert
    update_interval: 60s
    lambda: |-
      return id(ble_riavvii_guardiano);
  # quanti dispositivi sono collegati al proxy (su 3 slot)
  - platform: template
    name: "Dispositivi collegati al proxy"
    unit_of_measurement: ""
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    icon: mdi:bluetooth-connect
    update_interval: 10s
    lambda: |-
      return (id(ble_conn_1)->connected() ? 1 : 0) + (id(ble_conn_2)->connected() ? 1 : 0) + (id(ble_conn_3)->connected() ? 1 : 0);
  # segnale del modulo della stufa, dall'ultimo avviso ricevuto
  - platform: template
    name: "RSSI modulo stufa"
    id: ble_rssi_stufa
    unit_of_measurement: "dBm"
    device_class: signal_strength
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
  - platform: template
    name: "Ultimo segnale modulo stufa"
    unit_of_measurement: "s"
    device_class: duration
    state_class: measurement
    accuracy_decimals: 0
    entity_category: diagnostic
    update_interval: 30s
    lambda: |-
      if (id(ble_ultimo_avviso) == 0) return NAN;
      return (millis() - id(ble_ultimo_avviso)) / 1000.0;

binary_sensor:
  # acceso finche' il modulo della stufa e' stato sentito negli ultimi 2 minuti
  - platform: template
    name: "Modulo stufa visibile"
    device_class: connectivity
    entity_category: diagnostic
    lambda: |-
      return id(ble_ultimo_avviso) != 0 && (millis() - id(ble_ultimo_avviso)) < 120000;

button:
  - platform: restart
    name: "Riavvia"

web_server:
  port: 80
