<text x="630" y="724" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">filo che cambia destinazione</text>
<polyline points="840,720 900,720" fill="none" stroke="#92400e" stroke-width="4" stroke-linejoin="round"/>
<text x="910" y="724" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">filo nuovo</text>
<text x="50" y="748" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">1  Pompa COLLETTORE (OUT1): la fase che arriva al pin 6 passa prima dallo Shelly EM Mini: dal nodo L entra in L dello Shelly, esce da O e va al pin 6. Il pin 7 e la pompa restano come sono.</text>
<text x="50" y="770" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">2  Pompa INTEGRAZIONE (OUT2): il filo che oggi esce dal pin 9 verso la pompa va invece all'ingresso SW dello Shelly 1PM. Il pin 8 resta con la sua fase.</text>
<text x="50" y="792" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">3  Lo Shelly 1PM si alimenta da L e N permanenti (stessa fase del pin 8), non dal contatto OUT2.</text>
<text x="50" y="814" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">4  Filo nuovo dall'uscita O dello Shelly 1PM alla fase della pompa di integrazione. Neutro e terra della pompa restano come sono.</text>
<text x="50" y="838" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">L'EM Mini misura solo la pompa del collettore, ma è alimentato sempre (L e N permanenti): resta acceso anche a pompa ferma. Non è più in serie sulla fase principale: Elios, 1PM ed EM Mini prendono la fase direttamente dal quadro.</text>
<text x="50" y="860" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Il ponticello dal morsetto L al pin 6 (esempio del manuale, pag. 11) si toglie: il pin 6 ora riceve la fase dall'EM Mini. Verifica sul tuo impianto quale dei due pin riceve la fase.</text>
<text x="50" y="886" font-size="12.5" font-weight="700" fill="#dc2626" text-anchor="start">Stessa fase per tutti i collegamenti. Togli corrente dal quadro prima di toccare qualsiasi filo. Lavori da elettricista abilitato, con puntalini sui conduttori.</text>
</svg>