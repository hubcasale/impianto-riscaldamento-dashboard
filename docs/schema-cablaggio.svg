<text x="700.0" y="34" font-size="21" font-weight="700" fill="#0f172a" text-anchor="middle">Elios 25: misura della pompa del collettore (EM Mini) e controllo della pompa di integrazione (Shelly 1PM)</text>
<text x="700.0" y="56" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">Numeri dei morsetti dal manuale Elios 25: OUT1 = pin 6 e 7, OUT2 = pin 8 e 9. I contatti OUT sono puliti: il pin 6 (o 8) riceve la fase, il pin 7 (o 9) la porta alla pompa.</text>
