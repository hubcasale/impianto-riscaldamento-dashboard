<text x="700.0" y="34" font-size="21" font-weight="700" fill="#0f172a" text-anchor="middle">Elios 25: misura della pompa del collettore (EM Mini) e controllo della pompa di integrazione (Shelly 1PM)</text>
<text x="700.0" y="56" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">Morsetti dal manuale Elios 25: OUT1 = pin 6 (L) e 7 (N), OUT2 = pin 8 (L) e 9 (N). Provato con il cercafase: L ha fase solo con la pompa in marcia, N mai.</text>
