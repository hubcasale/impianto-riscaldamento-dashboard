<polyline points="840,700 900,700" fill="none" stroke="#92400e" stroke-width="4" stroke-linejoin="round"/>
<text x="910" y="704" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">filo nuovo</text>
<text x="50" y="728" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">1  Shelly EM Mini in serie sulla fase che alimenta l'Elios: dal quadro in L, da O al morsetto «L alimentazione» (il filo che oggi arriva all'Elios). N dello Shelly al neutro comune. Sempre alimentato.</text>
<text x="50" y="750" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">2  Pompa INTEGRAZIONE (OUT2): il filo di fase che oggi va dal pin 8 alla pompa va invece all'ingresso SW dello Shelly 1PM: l'ingresso vede quando l'Elios chiama la pompa. Il neutro resta al pin 9.</text>
<text x="50" y="772" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">3  Lo Shelly 1PM prende L dalla fase del quadro, in parallelo all'Elios e prima dell'EM Mini: sempre acceso, può bloccare la pompa anche quando l'Elios la chiama, e la sua pompa non passa dall'EM Mini.</text>
<text x="50" y="794" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">4  Filo nuovo dall'uscita O dello Shelly 1PM alla fase della pompa di integrazione. Neutro e terra della pompa restano come sono.</text>
<text x="50" y="820" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Pompa COLLETTORE (OUT1): nessuna modifica, resta collegata come ora (pin 6 fase, pin 7 neutro). Si deduce dalla potenza letta dall'EM Mini.</text>
<text x="50" y="842" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Prima di montare l'1PM l'EM Mini vede anche la pompa di integrazione (30-40 W; entrambe le pompe sopra 55 W).</text>
<text x="50" y="864" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Prima di collegare SW verifica con il cercafase che a pompa ferma il filo non abbia tensione. L'EM Mini sopporta fino a 16 A: la fase dell'Elios (pompe da 20-40 W) è ben dentro il limite.</text>
<text x="50" y="896" font-size="12.5" font-weight="700" fill="#dc2626" text-anchor="start">Togli corrente dal quadro prima di toccare qualsiasi filo. Lavori da elettricista abilitato, con puntalini sui conduttori. I fili morti di OUT3 vanno scollegati e isolati.</text>
</svg>