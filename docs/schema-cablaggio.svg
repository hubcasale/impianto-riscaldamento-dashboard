<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" width="1400" height="800" font-family="Helvetica, Arial, sans-serif">
<rect width="1400" height="800" fill="#ffffff"/>
<text x="700.0" y="34" font-size="22" font-weight="700" fill="#0f172a" text-anchor="middle">Pompa di integrazione con Shelly 1PM: schema dei collegamenti</text>
<text x="700.0" y="56" font-size="12.5" font-weight="400" fill="#475569" text-anchor="middle">L'Elios (schema 02, OUT2) non alimenta più la pompa: dà solo il segnale «richiesta integrazione». Il relè dello Shelly alimenta la pompa e può bloccarla da Home Assistant.</text>
