<text x="900.0" y="479" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Shelly di misura (esistente)</text>
<text x="900.0" y="497" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">in serie su questa linea</text>
