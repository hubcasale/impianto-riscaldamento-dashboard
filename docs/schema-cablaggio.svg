<text x="770" y="423" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text>
<circle cx="1075" cy="286" r="13" fill="#dc2626"/>
<text x="1075" y="291" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<rect x="30" y="578" width="1340" height="170" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<polyline points="50,600 100,600" fill="none" stroke="#92400e" stroke-width="3" stroke-linejoin="round"/>
<text x="110" y="604" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">fase (L)</text>
<polyline points="210,600 260,600" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"/>
<text x="270" y="604" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">neutro (N)</text>
<polyline points="390,600 440,600" fill="none" stroke="#16a34a" stroke-width="4" stroke-linejoin="round"/>
<polyline points="390,600 440,600" fill="none" stroke="#facc15" stroke-width="4" stroke-linejoin="round" stroke-dasharray="6 6"/>
<text x="450" y="604" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">terra (PE)</text>
<polyline points="560,600 620,600" fill="none" stroke="#92400e" stroke-width="4" stroke-linejoin="round" stroke-dasharray="9 5"/>
<text x="630" y="604" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">filo che cambia destinazione</text>
<polyline points="840,600 900,600" fill="none" stroke="#92400e" stroke-width="4" stroke-linejoin="round"/>
<text x="910" y="604" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">filo nuovo</text>
<text x="50" y="632" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">1  Il filo di fase che oggi esce da OUT2 (morsetto b) verso la pompa va ora all'ingresso SW dello Shelly: l'Elios dà solo il segnale (la pompa non passa più da lì).</text>
<text x="50" y="654" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">2  Lo Shelly è alimentato da L e N permanenti, non dal contatto OUT2: deve restare acceso anche quando l'Elios non chiama la pompa.</text>
<text x="50" y="676" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">3  Filo nuovo dall'uscita O dello Shelly alla fase della pompa. Neutro e terra della pompa restano com'erano; la linea del collettore (OUT1) non cambia.</text>
<text x="50" y="700" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">«N comune» e «terra comune» sono le barre che hai già: i tratti disegnati sono i conduttori di oggi, non servono fili in più.</text>
<text x="50" y="728" font-size="12.5" font-weight="700" fill="#dc2626" text-anchor="start">Stessa fase per L, SW e O. Prima di toccare qualsiasi filo togli corrente dal quadro. Lavori da elettricista abilitato, con puntalini sui conduttori.</text>
</svg>