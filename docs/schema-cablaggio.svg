<text x="630" y="704" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">filo che cambia destinazione</text>
<polyline points="840,700 900,700" fill="none" stroke="#92400e" stroke-width="4" stroke-linejoin="round"/>
<text x="910" y="704" font-size="12" font-weight="400" fill="#0f172a" text-anchor="start">filo nuovo</text>
<text x="50" y="728" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">1  Pompa COLLETTORE (OUT1): il filo di fase che oggi va dal pin 6 alla pompa si taglia in due: il lato pin 6 va in L dello Shelly EM Mini, da O parte la fase verso la pompa. Neutro dal pin 7 alla pompa come ora.</text>
<text x="50" y="750" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">2  Pompa INTEGRAZIONE (OUT2): il filo di fase che oggi va dal pin 8 alla pompa va invece all'ingresso SW dello Shelly 1PM: l'ingresso vede quando l'Elios chiama la pompa. Il neutro resta al pin 9.</text>
<text x="50" y="772" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">3  Lo Shelly 1PM si alimenta da L (fase permanente dal quadro) e N: resta sempre acceso e può bloccare la pompa anche quando l'Elios la chiama.</text>
<text x="50" y="794" font-size="12.5" font-weight="400" fill="#0f172a" text-anchor="start">4  Filo nuovo dall'uscita O dello Shelly 1PM alla fase della pompa di integrazione. Neutro e terra della pompa restano come sono.</text>
<text x="50" y="820" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Attenzione: l'EM Mini prende L dalla fase commutata, quindi si accende solo quando la pompa del collettore gira (10-30 s per avviarsi e collegarsi al Wi-Fi): a pompa ferma risulta non disponibile.</text>
<text x="50" y="842" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Alternativa senza watt ma sempre acceso: uno Shelly 1 Mini con il solo ingresso SW collegato al pin 6 (indica se la pompa è chiamata). Prima di collegare SW verifica con il cercafase che a pompa ferma il filo non abbia tensione.</text>
<text x="50" y="872" font-size="12.5" font-weight="700" fill="#dc2626" text-anchor="start">Togli corrente dal quadro prima di toccare qualsiasi filo. Lavori da elettricista abilitato, con puntalini sui conduttori. I fili morti di OUT3 vanno scollegati e isolati.</text>
</svg>