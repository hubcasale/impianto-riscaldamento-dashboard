# Blocco della pompa di integrazione con lo Shelly 1PM (relè disgiunto).
# L'Elios chiama la pompa quando il boiler solare e' freddo, senza controllare se il puffer della caldaia e' piu' caldo.
# Se la pompa non serve (per esempio caldaia spenta e puffer freddo) Home Assistant tiene acceso il booleano virtuale
# tiene il blocco sullo Shelly con un segnale di presenza (GET /script/1/block): il relè resta aperto anche se l'Elios chiama.
# Lo script dello Shelly (shelly/integrazione-blocco.js) fa scadere il blocco da solo dopo 600 s dall'ultimo segnale:
# Home Assistant lo rinnova ogni 5 minuti e lo toglie subito con /unblock; se Home Assistant o il Wi-Fi spariscono la
# pompa torna a seguire l'Elios.
#
# Regola: puffer (sensor.casale_temperatura_boiler) meno boiler alto stimato (sensor.boiler_solare_alto_stimato).
#   Inutile quando la differenza e' sotto "delta blocco" (4 C); torna utile sopra "delta sblocco" (7 C).
#   Senza una delle due letture non si blocca mai.
# INTERRUTTORE GENERALE: input_boolean.caldaia_integrazione_blocco_attivo, spento di partenza. Si accende solo dopo la
# prova del relè con l'Elios in manuale. Spento = nessun blocco (il booleano dello Shelly viene tenuto spento).

input_boolean:
  caldaia_integrazione_blocco_attivo:
    name: Integrazione - blocco automatico attivo
    icon: mdi:pump-off
  caldaia_integrazione_defaults_impostati:
    name: Integrazione - soglie blocco, valori iniziali impostati
    icon: mdi:check

input_number:
  caldaia_integrazione_delta_blocco:
    name: Integrazione - blocca se il puffer supera il boiler di meno di
    min: 0
    max: 15
    step: 0.5
    unit_of_measurement: °C
    mode: box
  caldaia_integrazione_delta_sblocco:
    name: Integrazione - sblocca quando il puffer supera il boiler di
    min: 1
    max: 20
    step: 0.5
    unit_of_measurement: °C
    mode: box

rest_command:
  shelly_integrazione_blocco:
    url: "http://192.168.178.119/script/1/block"
    method: get
    timeout: 8
  shelly_integrazione_sblocco:
    url: "http://192.168.178.119/script/1/unblock"
    method: get
    timeout: 8

template:
  - binary_sensor:
      - name: Caldaia integrazione inutile
        unique_id: caldaia_integrazione_inutile
        icon: mdi:pump-off
        state: >
          {% set p = states('sensor.casale_temperatura_boiler') | float(none) %}
          {% set b = states('sensor.boiler_solare_alto_stimato') | float(none) %}
          {% if p is none or b is none %}false
          {% else %}
            {% set d = p - b %}
            {% if this.state == 'on' %}{{ d < states('input_number.caldaia_integrazione_delta_sblocco') | float(7) }}
            {% else %}{{ d < states('input_number.caldaia_integrazione_delta_blocco') | float(4) }}{% endif %}
          {% endif %}
        attributes:
          differenza: >
            {% set p = states('sensor.casale_temperatura_boiler') | float(none) %}
            {% set b = states('sensor.boiler_solare_alto_stimato') | float(none) %}
            {{ none if p is none or b is none else (p - b) | round(1) }}

automation:
  - id: caldaia_integrazione_blocco
    alias: Caldaia - blocco pompa di integrazione (Shelly 1PM)
    description: Tiene il blocco dello Shelly 1PM allineato alla regola; lo rinnova ogni 5 minuti (scade da solo 10 minuti dopo l'ultimo segnale).
    mode: restart
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.caldaia_integrazione_inutile
          - input_boolean.caldaia_integrazione_blocco_attivo
        to:
          - "on"
          - "off"
      - trigger: time_pattern
        minutes: "/5"
      - trigger: homeassistant
        event: start
    actions:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.caldaia_integrazione_blocco_attivo
                state: "on"
              - condition: state
                entity_id: binary_sensor.caldaia_integrazione_inutile
                state: "on"
            sequence:
              - action: rest_command.shelly_integrazione_blocco
                continue_on_error: true
        default:
          - action: rest_command.shelly_integrazione_sblocco
            continue_on_error: true

  - id: caldaia_integrazione_valori_iniziali
    alias: Caldaia - soglie blocco integrazione, valori iniziali
    triggers:
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.caldaia_integrazione_defaults_impostati
        state: "off"
    actions:
      - action: input_number.set_value
        target: {entity_id: input_number.caldaia_integrazione_delta_blocco}
        data: {value: 4}
      - action: input_number.set_value
        target: {entity_id: input_number.caldaia_integrazione_delta_sblocco}
        data: {value: 7}
      - action: input_boolean.turn_on
        target: {entity_id: input_boolean.caldaia_integrazione_defaults_impostati}
