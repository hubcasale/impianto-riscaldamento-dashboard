# Boiler solare (ACS, 200 L): stima di temperatura media, energia accumulata e acqua calda disponibile
# a partire da due sonde (alto e basso) lette dall'ESP32 "solare-termico".
# Modello semplice: il serbatoio e' diviso in due zone. La parte alta e' rappresentata dalla sonda alta,
# il resto dalla sonda bassa (sul fondo del serbatoio).
# Il peso della zona alta e' regolabile (default 40 %).
# Le sonde NTC dell'ESP32 hanno oggi uno scarso contatto termico: sentono in parte l'aria del garage e leggono piu'
# basso della centralina Elios (S3 alta, S2 bassa). Correzione provvisoria con il modello di accoppiamento:
#     stimata = T_ambiente + (grezza - T_ambiente) / k + delta
# con T_ambiente = 16 C (garage), k_alto = 0.766, k_basso = 0.73 (ricavati da 5 letture di S3/S2 della centralina,
# errore sotto 0.3 C). Il delta serve per ritocchi fini. Quando arrivano le sonde nuove: k = 1 e delta = 0.
#
# CURVA DI ADATTAMENTO: ogni volta che si legge S3 o S2 sulla centralina, si scrive il valore nel campo
# "lettura" e si preme "registra": il sistema salva la coppia (grezza, reale) e, con almeno 3 punti ben distanziati
# (deviazione standard di almeno 1,5 C sulla grezza), calcola la retta  reale = a * grezza + b  (minimi quadrati) e la usa al posto del
# modello. Con meno punti usa il modello. Si tengono gli ultimi 15 punti per sonda.

input_boolean:
  boiler_solare_defaults_impostati:
    name: Boiler solare - valori iniziali impostati
    icon: mdi:check
  boiler_solare_defaults_v2_impostati:
    name: Boiler solare - valori iniziali v2 impostati
    icon: mdi:check
  boiler_solare_defaults_v3_impostati:
    name: Boiler solare - valori iniziali v3 impostati
    icon: mdi:check
  boiler_solare_defaults_v4_impostati:
    name: Boiler solare - valori iniziali v4 impostati
    icon: mdi:check

input_text:
  boiler_cal_punti_alto:
    name: Boiler solare - punti di taratura sonda alta (grezza:reale)
    max: 255
    icon: mdi:chart-scatter-plot
  boiler_cal_punti_basso:
    name: Boiler solare - punti di taratura sonda bassa (grezza:reale)
    max: 255
    icon: mdi:chart-scatter-plot

input_number:
  boiler_cal_s3:
    name: Boiler solare - lettura S3 della centralina
    min: 10
    max: 90
    step: 0.1
    unit_of_measurement: °C
    mode: box
  boiler_cal_s2:
    name: Boiler solare - lettura S2 della centralina
    min: 10
    max: 90
    step: 0.1
    unit_of_measurement: °C
    mode: box
  boiler_solare_t_ambiente:
    name: Boiler solare - temperatura ambiente delle sonde (garage)
    min: 0
    max: 35
    step: 0.5
    unit_of_measurement: °C
    mode: box
  boiler_solare_k_alto:
    name: Boiler solare - accoppiamento sonda alta (1 = perfetto)
    min: 0.3
    max: 1
    step: 0.001
    mode: box
  boiler_solare_k_basso:
    name: Boiler solare - accoppiamento sonda bassa (1 = perfetto)
    min: 0.3
    max: 1
    step: 0.001
    mode: box
  boiler_solare_delta_alto:
    name: Boiler solare - correzione sonda alta (S3 meno ESP32)
    min: -20
    max: 20
    step: 0.1
    unit_of_measurement: °C
    mode: box
  boiler_solare_delta_basso:
    name: Boiler solare - correzione sonda bassa (S2 meno ESP32)
    min: -20
    max: 20
    step: 0.1
    unit_of_measurement: °C
    mode: box
  boiler_solare_volume:
    name: Boiler solare - volume
    min: 50
    max: 1000
    step: 5
    unit_of_measurement: L
    mode: box
  boiler_solare_peso_alto:
    name: Boiler solare - quota di volume della zona alta
    min: 10
    max: 90
    step: 5
    unit_of_measurement: "%"
    mode: box
  boiler_solare_t_rete:
    name: Boiler solare - temperatura acqua di rete
    min: 5
    max: 25
    step: 0.5
    unit_of_measurement: °C
    mode: box
  boiler_solare_t_utile:
    name: Boiler solare - temperatura utile dell'acqua calda
    min: 30
    max: 55
    step: 1
    unit_of_measurement: °C
    mode: box

template:
  - sensor:
      - name: Boiler solare - curva sonda alta
        unique_id: boiler_solare_curva_alto
        icon: mdi:chart-line
        state: >
          {% set ns = namespace(n=0, sx=0.0, sy=0.0, sxx=0.0, sxy=0.0) %}
          {% for p in states('input_text.boiler_cal_punti_alto').split(',') if p %}
            {% set xy = p.split(':') %}
            {% if xy | length == 2 %}
              {% set x = xy[0] | float(none) %}{% set y = xy[1] | float(none) %}
              {% if x is not none and y is not none %}
                {% set ns.n = ns.n + 1 %}{% set ns.sx = ns.sx + x %}{% set ns.sy = ns.sy + y %}
                {% set ns.sxx = ns.sxx + x * x %}{% set ns.sxy = ns.sxy + x * y %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {% set d = ns.n * ns.sxx - ns.sx * ns.sx %}
          {% if ns.n >= 3 and d > 0 and d / (ns.n * ns.n) >= 2.25 %}
            {% set a = (ns.n * ns.sxy - ns.sx * ns.sy) / d %}
            {% if 1.0 <= a <= 1.8 %}regressione{% else %}modello{% endif %}
          {% else %}modello{% endif %}
        attributes:
          punti: >
            {{ states('input_text.boiler_cal_punti_alto').split(',') | reject('equalto', '') | list | length }}
          a: >
            {% set ns = namespace(n=0, sx=0.0, sy=0.0, sxx=0.0, sxy=0.0) %}
            {% for p in states('input_text.boiler_cal_punti_alto').split(',') if p %}
              {% set xy = p.split(':') %}
              {% if xy | length == 2 %}
                {% set x = xy[0] | float(none) %}{% set y = xy[1] | float(none) %}
                {% if x is not none and y is not none %}
                  {% set ns.n = ns.n + 1 %}{% set ns.sx = ns.sx + x %}{% set ns.sy = ns.sy + y %}
                  {% set ns.sxx = ns.sxx + x * x %}{% set ns.sxy = ns.sxy + x * y %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {% set d = ns.n * ns.sxx - ns.sx * ns.sx %}
            {% set k = states('input_number.boiler_solare_k_alto') | float(1) %}
            {% set modello = 1 / k %}
            {% if ns.n >= 3 and d > 0 and d / (ns.n * ns.n) >= 2.25 %}
              {% set a = (ns.n * ns.sxy - ns.sx * ns.sy) / d %}
              {{ (a if 1.0 <= a <= 1.8 else modello) | round(4) }}
            {% else %}{{ modello | round(4) }}{% endif %}
          b: >
            {% set ns = namespace(n=0, sx=0.0, sy=0.0, sxx=0.0, sxy=0.0) %}
            {% for p in states('input_text.boiler_cal_punti_alto').split(',') if p %}
              {% set xy = p.split(':') %}
              {% if xy | length == 2 %}
                {% set x = xy[0] | float(none) %}{% set y = xy[1] | float(none) %}
                {% if x is not none and y is not none %}
                  {% set ns.n = ns.n + 1 %}{% set ns.sx = ns.sx + x %}{% set ns.sy = ns.sy + y %}
                  {% set ns.sxx = ns.sxx + x * x %}{% set ns.sxy = ns.sxy + x * y %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {% set d = ns.n * ns.sxx - ns.sx * ns.sx %}
            {% set amb = states('input_number.boiler_solare_t_ambiente') | float(16) %}
            {% set k = states('input_number.boiler_solare_k_alto') | float(1) %}
            {% set a = (ns.n * ns.sxy - ns.sx * ns.sy) / d if (ns.n >= 3 and d > 0 and d / (ns.n * ns.n) >= 2.25) else 0 %}
            {% if 1.0 <= a <= 1.8 %}{{ ((ns.sy - a * ns.sx) / ns.n) | round(3) }}
            {% else %}{{ (amb * (1 - 1 / k)) | round(3) }}{% endif %}

      - name: Boiler solare - curva sonda bassa
        unique_id: boiler_solare_curva_basso
        icon: mdi:chart-line
        state: >
          {% set ns = namespace(n=0, sx=0.0, sy=0.0, sxx=0.0, sxy=0.0) %}
          {% for p in states('input_text.boiler_cal_punti_basso').split(',') if p %}
            {% set xy = p.split(':') %}
            {% if xy | length == 2 %}
              {% set x = xy[0] | float(none) %}{% set y = xy[1] | float(none) %}
              {% if x is not none and y is not none %}
                {% set ns.n = ns.n + 1 %}{% set ns.sx = ns.sx + x %}{% set ns.sy = ns.sy + y %}
                {% set ns.sxx = ns.sxx + x * x %}{% set ns.sxy = ns.sxy + x * y %}
              {% endif %}
            {% endif %}
          {% endfor %}
          {% set d = ns.n * ns.sxx - ns.sx * ns.sx %}
          {% if ns.n >= 3 and d > 0 and d / (ns.n * ns.n) >= 2.25 %}
            {% set a = (ns.n * ns.sxy - ns.sx * ns.sy) / d %}
            {% if 1.0 <= a <= 1.8 %}regressione{% else %}modello{% endif %}
          {% else %}modello{% endif %}
        attributes:
          punti: >
            {{ states('input_text.boiler_cal_punti_basso').split(',') | reject('equalto', '') | list | length }}
          a: >
            {% set ns = namespace(n=0, sx=0.0, sy=0.0, sxx=0.0, sxy=0.0) %}
            {% for p in states('input_text.boiler_cal_punti_basso').split(',') if p %}
              {% set xy = p.split(':') %}
              {% if xy | length == 2 %}
                {% set x = xy[0] | float(none) %}{% set y = xy[1] | float(none) %}
                {% if x is not none and y is not none %}
                  {% set ns.n = ns.n + 1 %}{% set ns.sx = ns.sx + x %}{% set ns.sy = ns.sy + y %}
                  {% set ns.sxx = ns.sxx + x * x %}{% set ns.sxy = ns.sxy + x * y %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {% set d = ns.n * ns.sxx - ns.sx * ns.sx %}
            {% set k = states('input_number.boiler_solare_k_basso') | float(1) %}
            {% set modello = 1 / k %}
            {% if ns.n >= 3 and d > 0 and d / (ns.n * ns.n) >= 2.25 %}
              {% set a = (ns.n * ns.sxy - ns.sx * ns.sy) / d %}
              {{ (a if 1.0 <= a <= 1.8 else modello) | round(4) }}
            {% else %}{{ modello | round(4) }}{% endif %}
          b: >
            {% set ns = namespace(n=0, sx=0.0, sy=0.0, sxx=0.0, sxy=0.0) %}
            {% for p in states('input_text.boiler_cal_punti_basso').split(',') if p %}
              {% set xy = p.split(':') %}
              {% if xy | length == 2 %}
                {% set x = xy[0] | float(none) %}{% set y = xy[1] | float(none) %}
                {% if x is not none and y is not none %}
                  {% set ns.n = ns.n + 1 %}{% set ns.sx = ns.sx + x %}{% set ns.sy = ns.sy + y %}
                  {% set ns.sxx = ns.sxx + x * x %}{% set ns.sxy = ns.sxy + x * y %}
                {% endif %}
              {% endif %}
            {% endfor %}
            {% set d = ns.n * ns.sxx - ns.sx * ns.sx %}
            {% set amb = states('input_number.boiler_solare_t_ambiente') | float(16) %}
            {% set k = states('input_number.boiler_solare_k_basso') | float(1) %}
            {% set a = (ns.n * ns.sxy - ns.sx * ns.sy) / d if (ns.n >= 3 and d > 0 and d / (ns.n * ns.n) >= 2.25) else 0 %}
            {% if 1.0 <= a <= 1.8 %}{{ ((ns.sy - a * ns.sx) / ns.n) | round(3) }}
            {% else %}{{ (amb * (1 - 1 / k)) | round(3) }}{% endif %}
      - name: Boiler solare - alto stimato
        unique_id: boiler_solare_alto_stimato
        unit_of_measurement: °C
        device_class: temperature
        state_class: measurement
        icon: mdi:thermometer-high
        availability: >
          {{ is_number(states('sensor.solare_termico_boiler_alto'))
             and states('sensor.solare_termico_boiler_alto') | float > -20
             and is_number(states('input_number.boiler_solare_k_alto')) }}
        state: >
          {% set a = state_attr('sensor.boiler_solare_curva_sonda_alta', 'a') | float(none) %}
          {% set b = state_attr('sensor.boiler_solare_curva_sonda_alta', 'b') | float(none) %}
          {% if a is none or b is none %}
            {% set amb = states('input_number.boiler_solare_t_ambiente') | float(16) %}
            {% set k = states('input_number.boiler_solare_k_alto') | float(1) %}
            {% set a = 1 / k %}{% set b = amb * (1 - 1 / k) %}
          {% endif %}
          {{ (a * states('sensor.solare_termico_boiler_alto') | float + b
              + states('input_number.boiler_solare_delta_alto') | float(0)) | round(1) }}

      - name: Boiler solare - basso stimato
        unique_id: boiler_solare_basso_stimato
        unit_of_measurement: °C
        device_class: temperature
        state_class: measurement
        icon: mdi:thermometer-low
        availability: >
          {{ is_number(states('sensor.garage_solare_termico_boiler_basso'))
             and states('sensor.garage_solare_termico_boiler_basso') | float > -20
             and is_number(states('input_number.boiler_solare_k_basso')) }}
        state: >
          {% set a = state_attr('sensor.boiler_solare_curva_sonda_bassa', 'a') | float(none) %}
          {% set b = state_attr('sensor.boiler_solare_curva_sonda_bassa', 'b') | float(none) %}
          {% if a is none or b is none %}
            {% set amb = states('input_number.boiler_solare_t_ambiente') | float(16) %}
            {% set k = states('input_number.boiler_solare_k_basso') | float(1) %}
            {% set a = 1 / k %}{% set b = amb * (1 - 1 / k) %}
          {% endif %}
          {{ (a * states('sensor.garage_solare_termico_boiler_basso') | float + b
              + states('input_number.boiler_solare_delta_basso') | float(0)) | round(1) }}

      - name: Boiler solare - temperatura media
        unique_id: boiler_solare_temperatura_media
        unit_of_measurement: °C
        device_class: temperature
        state_class: measurement
        icon: mdi:water-boiler
        availability: >
          {{ is_number(states('sensor.boiler_solare_alto_stimato'))
             and is_number(states('sensor.boiler_solare_basso_stimato'))
             and is_number(states('input_number.boiler_solare_peso_alto')) }}
        state: >
          {% set w = states('input_number.boiler_solare_peso_alto') | float / 100 %}
          {{ (w * states('sensor.boiler_solare_alto_stimato') | float
              + (1 - w) * states('sensor.boiler_solare_basso_stimato') | float) | round(1) }}

      - name: Boiler solare - stratificazione
        unique_id: boiler_solare_stratificazione
        unit_of_measurement: °C
        device_class: temperature
        state_class: measurement
        icon: mdi:arrow-collapse-vertical
        availability: >
          {{ is_number(states('sensor.boiler_solare_alto_stimato'))
             and is_number(states('sensor.boiler_solare_basso_stimato')) }}
        state: >
          {{ (states('sensor.boiler_solare_alto_stimato') | float
              - states('sensor.boiler_solare_basso_stimato') | float) | round(1) }}

      - name: Boiler solare - energia accumulata
        unique_id: boiler_solare_energia_accumulata
        unit_of_measurement: kWh
        device_class: energy_storage
        state_class: measurement
        icon: mdi:battery-charging-medium
        availability: >
          {{ is_number(states('sensor.boiler_solare_temperatura_media'))
             and is_number(states('input_number.boiler_solare_volume'))
             and is_number(states('input_number.boiler_solare_t_rete')) }}
        state: >
          {% set dt = states('sensor.boiler_solare_temperatura_media') | float
                      - states('input_number.boiler_solare_t_rete') | float %}
          {{ ([dt, 0] | max * states('input_number.boiler_solare_volume') | float * 1.163 / 1000) | round(2) }}

      - name: Boiler solare - acqua calda equivalente
        unique_id: boiler_solare_acqua_calda_equivalente
        unit_of_measurement: L
        state_class: measurement
        icon: mdi:water-thermometer
        availability: >
          {{ is_number(states('sensor.boiler_solare_temperatura_media'))
             and is_number(states('input_number.boiler_solare_volume'))
             and is_number(states('input_number.boiler_solare_t_rete'))
             and is_number(states('input_number.boiler_solare_t_utile')) }}
        state: >
          {% set tr = states('input_number.boiler_solare_t_rete') | float %}
          {% set tu = states('input_number.boiler_solare_t_utile') | float %}
          {% set dt = states('sensor.boiler_solare_temperatura_media') | float - tr %}
          {{ ([dt, 0] | max * states('input_number.boiler_solare_volume') | float / ([tu - tr, 1] | max)) | round(0) }}

automation:
  - id: boiler_solare_valori_iniziali
    alias: Boiler solare - valori iniziali
    description: Imposta volume, quota zona alta, temperatura di rete e temperatura utile una sola volta.
    triggers:
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.boiler_solare_defaults_impostati
        state: "off"
    actions:
      - action: input_number.set_value
        target: {entity_id: input_number.boiler_solare_volume}
        data: {value: 200}
      - action: input_number.set_value
        target: {entity_id: input_number.boiler_solare_peso_alto}
        data: {value: 40}
      - action: input_number.set_value
        target: {entity_id: input_number.boiler_solare_t_rete}
        data: {value: 15}
      - action: input_number.set_value
        target: {entity_id: input_number.boiler_solare_t_utile}
        data: {value: 40}
      - action: input_boolean.turn_on
        target: {entity_id: input_boolean.boiler_solare_defaults_impostati}

  - id: boiler_solare_valori_iniziali_v2
    alias: Boiler solare - valori iniziali v2
    description: Imposta le correzioni provvisorie delle sonde una sola volta (S3 meno ESP32 circa 9,5; S2 meno ESP32 circa 2).
    triggers:
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.boiler_solare_defaults_v2_impostati
        state: "off"
    actions:
      - action: input_number.set_value
        target: {entity_id: input_number.boiler_solare_delta_alto}
        data: {value: 9.5}
      - action: input_number.set_value
        target: {entity_id: input_number.boiler_solare_delta_basso}
        data: {value: 2.0}
      - action: input_boolean.turn_on
        target: {entity_id: input_boolean.boiler_solare_defaults_v2_impostati}

  - id: boiler_solare_valori_iniziali_v4
    alias: Boiler solare - valori iniziali v4
    description: Punti di taratura raccolti il 4 ottobre 2026 (sonda ESP32 grezza e lettura della centralina).
    triggers:
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.boiler_solare_defaults_v4_impostati
        state: "off"
    actions:
      - action: input_text.set_value
        target: {entity_id: input_text.boiler_cal_punti_alto}
        data: {value: "45.1:54.0,47.2:56.8,49.5:59.6"}
      - action: input_text.set_value
        target: {entity_id: input_text.boiler_cal_punti_basso}
        data: {value: "21.4:23.4,27.8:32.2"}
      - action: input_boolean.turn_on
        target: {entity_id: input_boolean.boiler_solare_defaults_v4_impostati}

  - id: boiler_solare_valori_iniziali_v3
    alias: Boiler solare - valori iniziali v3
    description: Passa dalla correzione fissa al modello di accoppiamento (una sola volta).
    triggers:
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.boiler_solare_defaults_v3_impostati
        state: "off"
    actions:
      - action: input_number.set_value
        target: {entity_id: input_number.boiler_solare_t_ambiente}
        data: {value: 16}
      - action: input_number.set_value
        target: {entity_id: input_number.boiler_solare_k_alto}
        data: {value: 0.766}
      - action: input_number.set_value
        target: {entity_id: input_number.boiler_solare_k_basso}
        data: {value: 0.73}
      - action: input_number.set_value
        target: {entity_id: input_number.boiler_solare_delta_alto}
        data: {value: 0}
      - action: input_number.set_value
        target: {entity_id: input_number.boiler_solare_delta_basso}
        data: {value: 0}
      - action: input_boolean.turn_on
        target: {entity_id: input_boolean.boiler_solare_defaults_v3_impostati}

script:
  boiler_cal_registra_alto:
    alias: Boiler solare - registra punto di taratura S3
    icon: mdi:plus-circle-outline
    sequence:
      - condition: template
        value_template: >
          {{ is_number(states('sensor.solare_termico_boiler_alto'))
             and states('sensor.solare_termico_boiler_alto') | float > -20
             and is_number(states('input_number.boiler_cal_s3')) }}
      - action: input_text.set_value
        target: {entity_id: input_text.boiler_cal_punti_alto}
        data:
          value: >
            {{ (states('input_text.boiler_cal_punti_alto').split(',') | reject('equalto', '') | list
                + [(states('sensor.solare_termico_boiler_alto') | float | round(2) | string) ~ ':'
                   ~ (states('input_number.boiler_cal_s3') | float | round(1) | string)])[-15:] | join(',') }}
  boiler_cal_registra_basso:
    alias: Boiler solare - registra punto di taratura S2
    icon: mdi:plus-circle-outline
    sequence:
      - condition: template
        value_template: >
          {{ is_number(states('sensor.garage_solare_termico_boiler_basso'))
             and states('sensor.garage_solare_termico_boiler_basso') | float > -20
             and is_number(states('input_number.boiler_cal_s2')) }}
      - action: input_text.set_value
        target: {entity_id: input_text.boiler_cal_punti_basso}
        data:
          value: >
            {{ (states('input_text.boiler_cal_punti_basso').split(',') | reject('equalto', '') | list
                + [(states('sensor.garage_solare_termico_boiler_basso') | float | round(2) | string) ~ ':'
                   ~ (states('input_number.boiler_cal_s2') | float | round(1) | string)])[-15:] | join(',') }}
  boiler_cal_annulla_alto:
    alias: Boiler solare - annulla ultimo punto S3
    icon: mdi:undo
    sequence:
      - action: input_text.set_value
