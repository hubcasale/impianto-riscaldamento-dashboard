# Pompe della centralina solare Elios.
# Sensore EM Mini sull'alimentazione dell'Elios (sensor.garage_centralina_solare_pompe_potenza): a riposo circa 1 W,
# pompa del collettore (ricircolo) circa 32 W, pompa di integrazione circa 50 W (misure del 5/10/2026, con l'integrazione
# ancora alimentata dall'Elios), entrambe oltre 65 W. Soglie con margine: ferme sotto 15 W, collettore fino a 42 W,
# integrazione fino a 65 W, entrambe da 65 W.
# Con lo Shelly 1PM sulla pompa di integrazione (sensor.garage_bs_pompa_integrazione_potenza, alimentato dal quadro e non
# piu' dall'Elios) l'EM Mini vede solo il collettore; l'integrazione e' "attiva" quando il 1PM supera la soglia di
# 20 W. Se il 1PM non e' disponibile vale la lettura dell'EM Mini (stati integrazione / entrambe).
# All'accensione di una pompa la potenza oscilla per qualche secondo, quindi gli stati hanno un ritardo in accensione di
# 20 s e in spegnimento di 30 s.
#
# Sensore sorgente: sensor.garage_centralina_solare_pompe_potenza
#
# INTERRUTTORE GENERALE: input_boolean.centralina_pompe_misura_attiva. Spento (valore iniziale) la misura e' esclusa dalla logica:
# stato e sensori "pompa attiva" risultano non disponibili e la scheda non mostra gli indicatori delle pompe.
# Da riaccendere quando il misuratore di potenza e' di nuovo collegato.
# Stato: sensor.caldaia_centralina_solare_pompe_stato = ferme | collettore | integrazione | entrambe | non_disponibile

input_boolean:
  centralina_pompe_misura_attiva:
    name: Centralina solare - misura potenza pompe attiva
    icon: mdi:flash
  caldaia_pompe_defaults_v2_impostati:
    name: Caldaia - soglie pompe v2, valori iniziali impostati
    icon: mdi:check

input_number:
  centralina_pompa_integrazione_w_min:
    name: Pompa integrazione - accesa sopra (Shelly 1PM)
    min: 1
    max: 100
    step: 1
    unit_of_measurement: W
    mode: box
  centralina_pompe_w_ferme:
    name: Centralina solare - pompe ferme sotto
    min: 0
    max: 40
    step: 0.5
    unit_of_measurement: W
    mode: box
  centralina_pompe_w_collettore_max:
    name: Centralina solare - solo collettore fino a
    min: 10
    max: 60
    step: 0.5
    unit_of_measurement: W
    mode: box
  centralina_pompe_w_entrambe_min:
    name: Centralina solare - entrambe le pompe da
    min: 30
    max: 120
    step: 0.5
    unit_of_measurement: W
    mode: box

template:
  - sensor:
      - name: Caldaia centralina solare pompe stato
        unique_id: caldaia_centralina_solare_pompe_stato
        icon: mdi:pump
        availability: "{{ is_state('input_boolean.centralina_pompe_misura_attiva', 'on') }}"
        state: >
          {% set w = states('sensor.garage_centralina_solare_pompe_potenza') %}
          {% if not is_number(w) %}non_disponibile
          {% else %}
            {% set w = w | float %}
            {% if w < states('input_number.centralina_pompe_w_ferme') | float(10) %}ferme
            {% elif w <= states('input_number.centralina_pompe_w_collettore_max') | float(26) %}collettore
            {% elif w < states('input_number.centralina_pompe_w_entrambe_min') | float(55) %}integrazione
            {% else %}entrambe{% endif %}
          {% endif %}
        attributes:
          potenza: "{{ states('sensor.garage_centralina_solare_pompe_potenza') }}"

  - binary_sensor:
      - name: Caldaia pompa integrazione attiva
        unique_id: caldaia_pompa_integrazione_attiva
        icon: mdi:pump
        device_class: running
        availability: "{{ is_state('input_boolean.centralina_pompe_misura_attiva', 'on') }}"
        delay_on: "00:00:20"
        delay_off: "00:00:30"
        state: >
          {% set s = states('sensor.caldaia_centralina_solare_pompe_stato') %}
          {% set p1 = states('sensor.garage_bs_pompa_integrazione_potenza') %}
          {% if is_number(p1) and p1 | float > states('input_number.centralina_pompa_integrazione_w_min') | float(20) %}true
          {% elif s == 'non_disponibile' or s in ['unknown', 'unavailable'] %}{{ this.state == 'on' }}
          {% else %}{{ s in ['integrazione', 'entrambe'] }}{% endif %}

      - name: Caldaia pompa collettore attiva
        unique_id: caldaia_pompa_collettore_attiva
        icon: mdi:pump
        device_class: running
        availability: "{{ is_state('input_boolean.centralina_pompe_misura_attiva', 'on') }}"
        delay_on: "00:00:20"
        delay_off: "00:00:30"
        state: >
          {% set s = states('sensor.caldaia_centralina_solare_pompe_stato') %}
          {% if s == 'non_disponibile' or s in ['unknown', 'unavailable'] %}{{ this.state == 'on' }}
          {% else %}{{ s in ['collettore', 'entrambe'] }}{% endif %}

sensor:
  - platform: history_stats
    name: Caldaia pompa integrazione ore oggi
    unique_id: caldaia_pompa_integrazione_ore_oggi
    entity_id: binary_sensor.caldaia_pompa_integrazione_attiva
    state: "on"
    type: time
    start: "{{ now().replace(hour=0, minute=0, second=0, microsecond=0) }}"
    end: "{{ now() }}"
  - platform: history_stats
    name: Caldaia pompa collettore ore oggi
    unique_id: caldaia_pompa_collettore_ore_oggi
    entity_id: binary_sensor.caldaia_pompa_collettore_attiva
    state: "on"
    type: time
    start: "{{ now().replace(hour=0, minute=0, second=0, microsecond=0) }}"
    end: "{{ now() }}"

automation:
  - id: caldaia_pompe_valori_iniziali_v2
    alias: Caldaia - soglie pompe, valori iniziali (v2)
    description: Una sola volta imposta le soglie dalle misure del 5/10/2026 e riaccende la misura delle pompe.
    triggers:
      - trigger: homeassistant
        event: start
    conditions:
      - condition: state
        entity_id: input_boolean.caldaia_pompe_defaults_v2_impostati
        state: "off"
    actions:
      - action: input_number.set_value
        target: {entity_id: input_number.centralina_pompe_w_ferme}
        data: {value: 15}
      - action: input_number.set_value
        target: {entity_id: input_number.centralina_pompe_w_collettore_max}
        data: {value: 42}
      - action: input_number.set_value
        target: {entity_id: input_number.centralina_pompe_w_entrambe_min}
        data: {value: 65}
      - action: input_number.set_value
        target: {entity_id: input_number.centralina_pompa_integrazione_w_min}
        data: {value: 20}
      - action: input_boolean.turn_on
        target: {entity_id: input_boolean.centralina_pompe_misura_attiva}
      - action: input_boolean.turn_on
        target: {entity_id: input_boolean.caldaia_pompe_defaults_v2_impostati}
